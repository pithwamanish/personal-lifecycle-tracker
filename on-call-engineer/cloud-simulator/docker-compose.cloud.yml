name: personal-lifecycle-cloud-emulator

services:
  cloud-emulator:
    image: floci/floci:latest
    container_name: personal-lifecycle-cloud-emulator
    restart: unless-stopped
    ports:
      - "4568:4566"
    environment:
      - SERVICES=s3,sns,sqs,events,logs
      - AWS_DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_floci/health"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
