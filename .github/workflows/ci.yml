name: CI Pipeline

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================================================
  # 1. PARALLEL TESTS: Backend Unit & Contract Tests
  # ===========================================================================
  test-backend:
    name: Backend Tests (FastAPI & Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure Docker Network Exists
        run: |
          docker network inspect personal-lifecycle-observability-net >/dev/null 2>&1 || docker network create personal-lifecycle-observability-net

      - name: Build Backend Image
        run: |
          docker compose build backend

      - name: Run Backend Unit Tests (Pytest)
        run: |
          docker compose run --rm -T --no-deps backend pytest tests -m "not integration" -v

  # ===========================================================================
  # 1. PARALLEL TESTS: Frontend Lint & Vitest Suite
  # ===========================================================================
  test-frontend:
    name: Frontend Tests (React & Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure Docker Network Exists
        run: |
          docker network inspect personal-lifecycle-observability-net >/dev/null 2>&1 || docker network create personal-lifecycle-observability-net

      - name: Build Frontend Image
        run: |
          docker compose build frontend

      - name: Run Frontend Lint & Vitest Unit Tests
        run: |
          docker compose run --rm -T --no-deps frontend sh -c "npm run lint && npm test"

  # ===========================================================================
  # 1. PARALLEL TESTS: Deterministic Security Audit (Semgrep SAST & npm audit)
  # ===========================================================================
  security-audit:
    name: Security Audit (Semgrep SAST & Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure Docker Network Exists
        run: |
          docker network inspect personal-lifecycle-observability-net >/dev/null 2>&1 || docker network create personal-lifecycle-observability-net

      - name: Build Frontend Image
        run: |
          docker compose build frontend

      - name: Run Semgrep OSS SAST Analysis
        run: |
          docker run --rm -v ${{ github.workspace }}:/src returntocorp/semgrep semgrep --config=p/python --config=p/secrets --config=p/jwt --error /src/backend

      - name: Run Frontend Security Audit
        run: |
          docker compose run --rm -T --no-deps frontend npm audit --audit-level=high

  # ===========================================================================
  # 2. DOCKER COMPOSE STACK: Integration & End-to-End Tests
  # ===========================================================================
  integration-and-e2e:
    name: Compose Stack (Integration & E2E Tests)
    needs: [test-backend, test-frontend, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure Docker Network Exists
        run: |
          docker network inspect personal-lifecycle-observability-net >/dev/null 2>&1 || docker network create personal-lifecycle-observability-net

      - name: Build Docker Compose Services (including test profile)
        run: |
          docker compose --profile test build

      - name: Start Compose Services (Database, Backend, Frontend)
        run: |
          docker compose up -d db backend frontend

      - name: Wait for Stack Healthiness
        run: |
          echo "Waiting for backend health endpoint (http://127.0.0.1:8003/health)..."
          timeout 90s bash -c 'until curl -fsS http://127.0.0.1:8003/health > /dev/null 2>&1; do sleep 2; done'
          echo "Backend is healthy!"
          curl -s http://127.0.0.1:8003/health

          echo "Waiting for frontend endpoint (http://127.0.0.1:3003)..."
          timeout 90s bash -c 'until curl -fsS http://127.0.0.1:3003 > /dev/null 2>&1; do sleep 2; done'
          echo "Frontend is healthy!"

      - name: Run PostgreSQL Integration Tests
        run: |
          docker compose run --rm -T -e INTEGRATION_BACKEND_URL=http://personal-lifecycle-tracker-backend:8000 backend pytest tests/integration -v

      - name: Run Playwright End-to-End Tests
        env:
          BASE_URL: http://127.0.0.1:3003
          BACKEND_URL: http://127.0.0.1:8003
        run: |
          docker compose up --exit-code-from e2e e2e

      - name: Dump Compose Logs on Failure
        if: failure()
        run: |
          docker compose logs --tail 100 backend
          docker compose logs --tail 100 frontend
          docker compose logs --tail 100 db
          docker compose logs --tail 100 e2e

      - name: Tear Down Compose Stack
        if: always()
        run: |
          docker compose down -v

      - name: Summarize CI Verification
        if: success()
        run: |
          echo "### ✅ Continuous Integration (CI) Verification Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Pytest Unit Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Lint & Vitest**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Semgrep SAST & npm audit**: Passed (Zero High/Critical)" >> $GITHUB_STEP_SUMMARY
          echo "- **PostgreSQL Integration Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Playwright E2E Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # 3. ON-CALL AUTONOMOUS INCIDENT DISPATCH (Fires automatically on ANY failure)
  # ===========================================================================
  notify-on-call:
    name: Notify On-Call Responder on Failure
    if: failure()
    needs: [test-backend, test-frontend, security-audit, integration-and-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dispatch Incident Payload to On-Call Responder
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          echo "================================================================"
          echo "  DISPATCHING AUTOMATED ON-CALL INCIDENT EVENT FOR CI FAILURE   "
          echo "================================================================"
          python3 on-call-engineer/scripts/receive-alert <<EOF
          {
            "workflow_run": {
              "id": $RUN_ID,
              "name": "$WORKFLOW_NAME",
              "conclusion": "failure",
              "head_branch": "$HEAD_BRANCH",
              "head_sha": "$HEAD_SHA",
              "html_url": "$RUN_URL",
              "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
          }
          EOF
