name: personal-lifecycle-tracker-prod

services:
  db:
    image: postgres:16-alpine
    container_name: personal-lifecycle-tracker-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lifecycle}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lifecycle}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    image: ${BACKEND_IMAGE:-personal-lifecycle-tracker-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    container_name: personal-lifecycle-tracker-backend-prod
    environment:
      PORT: 8000
      PYTHONUNBUFFERED: "1"
      CORS_ORIGINS: "http://localhost:8088"
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@db:5432/lifecycle}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-personal-lifecycle-tracker-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: personal-lifecycle-tracker-frontend-prod
    environment:
      PORT: 80
      BACKEND_URL: backend:8000
    ports:
      - "${PROD_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data_prod:
