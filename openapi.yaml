        upcomingCount:
          type: integer
          example: 3
        overdueItems:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleItem'
        upcomingItems:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleItem'
        htmlContent:
          type: string
        textContent:
          type: string

