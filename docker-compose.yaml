name: personal-lifecycle-tracker

services:
  db:
    image: postgres:16-alpine
    container_name: personal-lifecycle-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lifecycle}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lifecycle}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    container_name: personal-lifecycle-tracker-backend
    environment:
      PORT: 8000
      PYTHONUNBUFFERED: "1"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3003,http://localhost:5173"
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@db:5432/lifecycle}"
    ports:
      - "${BACKEND_PORT:-8003}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: personal-lifecycle-tracker-frontend
    environment:
      PORT: 3000
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8003}
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3003}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  e2e:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    container_name: personal-lifecycle-tracker-e2e
    network_mode: host
    environment:
      BASE_URL: "http://localhost:${FRONTEND_PORT:-3003}"
      BACKEND_URL: "http://localhost:${BACKEND_PORT:-8003}"
      CI: "true"
    volumes:
      - ./e2e:/e2e
      - /e2e/node_modules
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    profiles: ["test", "e2e"]

volumes:
  postgres_data:
